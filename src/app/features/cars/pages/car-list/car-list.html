<div class="car-list-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Car Inventory</mat-card-title>
    </mat-card-header>
    <mat-card-content>

  @let s = state();

  @if (s.status === 'loading') {
    <p>Loading cars...</p>
  } @else if (s.status === 'error') {
    <p>{{ s.message }}</p>
  } @else if (s.data.length === 0) {
    <p>No cars available at the moment.</p>
  } @else {
    <div class="grid">
      @for (car of s.data; track car._id) {
        <app-car-card [car]="car" />
      }
    </div>
  }
    </mat-card-content>
  </mat-card>
</div>
