<h2>Car Details</h2>

@let s = state();

@if (s.status === 'loading') {
  <p>Loading car details...</p>
}

@if (s.status === 'error') {
  <p>{{ s.message }}</p>
}

@if (s.status === 'loaded') {
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>
        {{ s.data.make }} {{ s.data.model }}
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <p>Year: {{ s.data.year }}</p>
    </mat-card-content>
  </mat-card>
}
