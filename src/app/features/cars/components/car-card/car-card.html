<mat-card>
  <mat-card-header>
    <mat-card-title>
      {{ car().make }} {{ car().model }}
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    @if (car().year) {
      <p>Year: {{ car().year }}</p>
    }
  </mat-card-content>

  <mat-card-actions>
    <a mat-button [routerLink]="['/cars', car()._id]">
      View Profile
    </a>
  </mat-card-actions>
</mat-card>
